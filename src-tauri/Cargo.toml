[package]
name = "bilipocket"
version = "0.9.0"
description = "BiliPocket — lightweight Bilibili downloader desktop app (Windows, Tauri 2)"
authors = ["huangguohong"]
edition = "2021"

[lib]
name = "bilipocket_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
tokio = { version = "1.54.1", features = ["process", "io-util", "sync", "time", "rt", "macros", "fs"] }
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v4"] }
md-5 = "0.10"
sha2 = "0.10"
url = "2.5.8"
reqwest = { version = "0.13.5", features = ["blocking", "cookies", "json", "query"] }
flate2 = "1"
keyring = "4.2.0"
qrcode = { version = "0.14.1", features = ["svg"] }
log = "0.4.35"
tauri-plugin-log = "2.10.1"
fs2 = "0.4.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_JobObjects"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
