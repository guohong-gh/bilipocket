name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - name: Verify JavaScript syntax
        run: |
          Get-ChildItem src/js/*.js, src/js/app/*.js | ForEach-Object { node --check $_.FullName }
          Get-ChildItem scripts/*.mjs | ForEach-Object { node --check $_.FullName }
      - name: Type-check frontend
        run: npm run typecheck
      - name: Browser UI regression
        run: npm run test:ui

      # The bundled engines (~103 MB) are not tracked in Git, so a fresh clone has none.
      # tauri-build fails hard when a literal bundle.resources path is missing, which would
      # abort every cargo command below. Record presence first, then drop empty placeholders
      # so compilation can proceed. Placeholders must never reach a test or a bundled build,
      # which is why every step that actually runs the engines is gated on the recorded value
      # instead of hashFiles (placeholders would satisfy a glob and defeat the guard).
      - name: Detect bundled sidecars
        id: sidecars
        shell: pwsh
        run: |
          $ytdlp = 'src-tauri/binaries/yt-dlp-x86_64-pc-windows-msvc.exe'
          $ffmpeg = 'src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe'
          if ((Test-Path $ytdlp) -and (Test-Path $ffmpeg)) {
            "present=true" >> $env:GITHUB_OUTPUT
            Write-Host "Bundled sidecars present; full verification enabled."
          } else {
            "present=false" >> $env:GITHUB_OUTPUT
            Write-Host "::warning::Bundled sidecars absent; desktop E2E, packaging and artifact steps will be skipped."
          }
      - name: Add sidecar compilation placeholders
        if: ${{ steps.sidecars.outputs.present != 'true' }}
        shell: pwsh
        run: |
          New-Item -ItemType File -Force -Path src-tauri/binaries/yt-dlp-x86_64-pc-windows-msvc.exe | Out-Null
          New-Item -ItemType File -Force -Path src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe | Out-Null
          Write-Host "Empty placeholders created solely to satisfy bundle.resources validation."

      # Known pre-existing debt: 10 files / 46 hunks differ from rustfmt's default
      # use_small_heuristics. Reformatting them would rewrite core logic files, which is a
      # deliberate standalone change rather than part of this hardening pass, so this gate
      # reports the drift without blocking the run. Clear it with `cargo fmt --all` in src-tauri.
      - name: Rust format
        continue-on-error: true
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib
      - name: Rust lint
        working-directory: src-tauri
        run: cargo clippy --all-targets
      - name: Build desktop debug binary
        working-directory: src-tauri
        run: cargo build
      - name: Build desktop E2E fixtures
        if: ${{ steps.sidecars.outputs.present == 'true' }}
        working-directory: src-tauri
        run: cargo build --example fake_ytdlp

      - name: Desktop E2E
        if: ${{ steps.sidecars.outputs.present == 'true' }}
        run: npm run test:desktop
      - name: Desktop extras E2E
        if: ${{ steps.sidecars.outputs.present == 'true' }}
        run: npm run test:desktop:extras
      - name: Desktop auto-retry E2E
        if: ${{ steps.sidecars.outputs.present == 'true' }}
        run: npm run test:desktop:retry
      - name: Desktop priority E2E
        if: ${{ steps.sidecars.outputs.present == 'true' }}
        run: npm run test:desktop:priority
      - name: Desktop update check E2E
        if: ${{ steps.sidecars.outputs.present == 'true' }}
        run: npm run test:desktop:update
      - name: Desktop crash recovery E2E
        if: ${{ steps.sidecars.outputs.present == 'true' }}
        run: npm run test:desktop:recovery

      - name: Verify pinned sidecars
        if: ${{ steps.sidecars.outputs.present == 'true' }}
        run: node scripts/verify-sidecars.mjs
      - name: Build release
        if: ${{ steps.sidecars.outputs.present == 'true' }}
        run: npm run build
      - name: Package portable build
        if: ${{ steps.sidecars.outputs.present == 'true' }}
        run: npm run package:portable
      - uses: actions/upload-artifact@v4
        if: ${{ steps.sidecars.outputs.present == 'true' }}
        with:
          name: bilipocket-windows
          path: |
            src-tauri/target/release/bilipocket.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/portable/*.zip
          if-no-files-found: error
