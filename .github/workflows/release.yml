name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Verify release version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("${{ github.ref_type }}" -eq "tag" -and $tag -ne $version) {
            throw "Tag v$tag does not match package.json version $version"
          }
      - name: Verify pinned sidecars
        run: node scripts/verify-sidecars.mjs
      - name: Configure update endpoint
        run: npm run set:update-source -- "https://github.com/${{ github.repository }}/releases/latest/download/latest.json"
      - name: Import Windows signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            Write-Host "::warning::WINDOWS_CERTIFICATE is not configured; building without Authenticode signing."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "bilipocket-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build signed release
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build:release
      - name: Package portable build
        run: npm run package:portable
      - name: Verify release artifacts
        run: npm run verify:release
      - name: Generate updater manifest
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $signature = "$($installer.FullName).sig"
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($installer.Name)"
          npm run make:latest -- --url "$url" --signature "$signature" --version "$version" --notes "BiliPocket v$version"
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $portable = Get-ChildItem src-tauri/target/release/bundle/portable/*.zip | Select-Object -First 1
          $signed = if ($env:WINDOWS_CERTIFICATE_THUMBPRINT) { "Authenticode signing configured; verify installer and app signatures" } else { "Unsigned" }
          gh release create "${{ github.ref_name }}" `
            "$($installer.FullName)" `
            "$($installer.FullName).sig" `
            "$($portable.FullName)" `
            "src-tauri/target/release/bundle/updater/latest.json" `
            --title "BiliPocket v$version" `
            --notes "$signed Windows beta release. See RELEASE.md for verification status. Use only for content you own or are authorized to download."
      - uses: actions/upload-artifact@v4
        with:
          name: bilipocket-release
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/portable/*.zip
            src-tauri/target/release/bundle/updater/latest.json
          if-no-files-found: error
