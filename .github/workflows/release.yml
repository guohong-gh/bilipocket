name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "已存在的 tag，例如 v0.9.0（用于不放新提交时重跑发布）"
        required: true

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      # 不覆盖 checkout 的 ref：tag 触发的运行构建该 tag；workflow_dispatch 触发时构建被派发的分支，
      # 只把 RELEASE_TAG 当作发布目标，便于用修好的流水线重发同一个 tag。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Provision bundled engines
        env:
          BILIPOCKET_ENGINES_URL: https://github.com/${{ github.repository }}/releases/download/engines-2026.10
        run: node scripts/fetch-sidecars.mjs
      - name: Verify release version
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG -replace '^v', ''
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $version) {
            throw "Tag $env:RELEASE_TAG does not match package.json version $version"
          }
      - name: Verify pinned sidecars
        run: node scripts/verify-sidecars.mjs
      - name: Configure update endpoint
        run: npm run set:update-source -- "https://github.com/${{ github.repository }}/releases/latest/download/latest.json"
      - name: Detect updater signing key
        id: signing
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "::warning::TAURI_SIGNING_PRIVATE_KEY is not configured; the release ships unsigned, without .sig and latest.json."
            exit 0
          }
          "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Import Windows signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            Write-Host "::warning::WINDOWS_CERTIFICATE is not configured; building without Authenticode signing."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "bilipocket-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build signed release
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build:release
      - name: Package portable build
        run: npm run package:portable
      - name: Verify release artifacts
        env:
          BILIPOCKET_ALLOW_UNSIGNED: ${{ steps.signing.outputs.enabled == 'false' && '1' || '' }}
        run: npm run verify:release
      - name: Generate updater manifest
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $signature = "$($installer.FullName).sig"
          $url = "https://github.com/${{ github.repository }}/releases/download/$($env:RELEASE_TAG)/$($installer.Name)"
          npm run make:latest -- --url "$url" --signature "$signature" --version "$version" --notes "BiliPocket v$version"
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNED_UPDATER: ${{ steps.signing.outputs.enabled }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $assets = @()
          $assets += (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe).FullName
          $assets += (Get-ChildItem src-tauri/target/release/bundle/portable/*.zip).FullName
          if ($env:SIGNED_UPDATER -eq "true") {
            $assets += (Get-ChildItem src-tauri/target/release/bundle/nsis/*.sig).FullName
            $assets += "src-tauri/target/release/bundle/updater/latest.json"
          }
          $signed = if ($env:WINDOWS_CERTIFICATE_THUMBPRINT) { "Authenticode signing configured; verify installer and app signatures" } else { "Unsigned" }
          $notes = "$signed Windows beta release. See RELEASE.md for verification status. Use only for content you own or are authorized to download."
          gh release view $env:RELEASE_TAG --json tagName 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber
            gh release edit $env:RELEASE_TAG --title "BiliPocket v$version"
          } else {
            gh release create $env:RELEASE_TAG @assets --title "BiliPocket v$version" --notes $notes
          }
      - uses: actions/upload-artifact@v4
        with:
          name: bilipocket-release
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/portable/*.zip
            src-tauri/target/release/bundle/updater/latest.json
          if-no-files-found: error
